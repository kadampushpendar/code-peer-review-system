# Active profile: default is 'h2' for quick local run without external database.
# To use MySQL, set environment variable SPRING_PROFILES_ACTIVE=mysql or pass -Dspring.profiles.active=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Origin of the React dev server (used for CORS)
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
# Teachers must enter this invite code to register. CHANGE IT.
app.teacher-code=${TEACHER_CODE:change-me-teacher-code}
# Optional: only allow emails ending with @your-college.edu (leave empty to allow any)
app.email-domain=${EMAIL_DOMAIN:}
